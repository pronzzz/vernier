name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  firebase:
    # Vercel deploys itself from GitHub; this job ships the same build to Firebase Hosting.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIREWORDLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Authenticate
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Make sure the vernier site exists
        run: npx -y firebase-tools@15 hosting:sites:get vernier --project firewordle || npx -y firebase-tools@15 hosting:sites:create vernier --project firewordle
      - name: Deploy (vernier.web.app + redirect from firewordle.web.app)
        run: npx -y firebase-tools@15 deploy --only hosting --project firewordle --non-interactive
