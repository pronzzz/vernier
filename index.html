<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vernier · a word game of bounds</title>
    <meta name="description" content="A daily five-letter word game. Every guess tells you which way each letter lies in the alphabet. Close in on the word in six." />
    <meta name="theme-color" content="#f2efe6" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://playvernier.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://playvernier.web.app/" />
    <meta property="og:title" content="Vernier" />
    <meta property="og:description" content="A daily word game of bounds. Every guess points toward the answer." />
    <meta property="og:image" content="https://playvernier.web.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('vernier:prefs') || '{}').theme
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Vernier is a word game and needs JavaScript to play.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
